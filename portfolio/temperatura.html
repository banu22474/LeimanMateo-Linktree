<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Temperatura</title>
  <link rel="stylesheet" href="portfolio_imagenes/calculadora.css" />
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="portfolio.html">Inicio</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="../index.html">Linktree</a></li>
      </ul>
    </nav>
  </header>

  <main class="calculadora-contenedor">
    <h1>Conversor de Temperatura</h1>

    <div id="pantalla" class="pantalla">0</div>

    <div class="botones">
      <button onclick="agregar('7')">7</button>
      <button onclick="agregar('8')">8</button>
      <button onclick="agregar('9')">9</button>
      <button onclick="borrar()">←</button>

      <button onclick="agregar('4')">4</button>
      <button onclick="agregar('5')">5</button>
      <button onclick="agregar('6')">6</button>
      <button onclick="agregar('.')">.</button>

      <button onclick="agregar('1')">1</button>
      <button onclick="agregar('2')">2</button>
      <button onclick="agregar('3')">3</button>
      <button onclick="limpiar()">C</button>

      <button onclick="agregar('0')">0</button>
    </div>

    <select id="conversion" class="selector">
      <option value="cf">Celsius a Fahrenheit</option>
      <option value="fc">Fahrenheit a Celsius</option>
    </select>

    <button class="convertir" onclick="convertir()">Convertir</button>

    <div id="resultado" class="resultado"></div>

  </main>

  <footer>
    <p>&copy; 2025 Mateo Leiman | Proyecto JS</p>
  </footer>

  <script src="temperatura.js"></script>
</body>
</html>
